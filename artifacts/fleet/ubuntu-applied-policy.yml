inputs:
  - id: logfile-system-54877b53-08c6-45f8-8802-3599e0e5d7bf
    name: system-3
    revision: 1
    type: logfile
    use_output: default
    meta:
      package:
        name: system
        version: 2.21.0
        policy_template: system
        release: ga
    data_stream:
      namespace: default
    package_policy_id: 54877b53-08c6-45f8-8802-3599e0e5d7bf
    streams:
      - id: logfile-system.auth-54877b53-08c6-45f8-8802-3599e0e5d7bf
        data_stream:
          dataset: system.auth
          type: logs
        condition: (${host.platform} != "windows") and (${host.os_version} != "12
          (bookworm)" and ${host.os_version} != "13 (trixie)" and
          (${host.os_platform} != "amzn" or ${host.os_version} != "2023") and
          (${host.os_platform} != "sles" or (${host.os_version} != "15 SP1" and
          ${host.os_version} != "15-SP1" and ${host.os_version} != "15 SP2" and
          ${host.os_version} != "15-SP2" and ${host.os_version} != "15 SP3" and
          ${host.os_version} != "15-SP3" and ${host.os_version} != "15 SP4" and
          ${host.os_version} != "15-SP4" and ${host.os_version} != "15 SP5" and
          ${host.os_version} != "15-SP5" and ${host.os_version} != "15 SP6" and
          ${host.os_version} != "15-SP6" and ${host.os_version} != "15 SP7" and
          ${host.os_version} != "15-SP7" and ${host.os_version} != "16.0")))
        ignore_older: 72h
        paths:
          - /var/log/auth.log*
          - /var/log/secure*
        exclude_files:
          - \.gz$
        multiline:
          pattern: ^\s
          match: after
        tags:
          - system-auth
        allow_deprecated_use: true
        processors:
          - add_locale: null
          - rename:
              fields:
                - from: message
                  to: event.original
              ignore_missing: true
              fail_on_error: false
          - syslog:
              field: event.original
              ignore_missing: true
              ignore_failure: true
      - id: logfile-system.syslog-54877b53-08c6-45f8-8802-3599e0e5d7bf
        data_stream:
          dataset: system.syslog
          type: logs
        condition: (${host.platform} != "windows") and (${host.os_version} != "12
          (bookworm)" and ${host.os_version} != "13 (trixie)" and
          (${host.os_platform} != "amzn" or ${host.os_version} != "2023") and
          (${host.os_platform} != "sles" or (${host.os_version} != "15 SP1" and
          ${host.os_version} != "15-SP1" and ${host.os_version} != "15 SP2" and
          ${host.os_version} != "15-SP2" and ${host.os_version} != "15 SP3" and
          ${host.os_version} != "15-SP3" and ${host.os_version} != "15 SP4" and
          ${host.os_version} != "15-SP4" and ${host.os_version} != "15 SP5" and
          ${host.os_version} != "15-SP5" and ${host.os_version} != "15 SP6" and
          ${host.os_version} != "15-SP6" and ${host.os_version} != "15 SP7" and
          ${host.os_version} != "15-SP7" and ${host.os_version} != "16.0")))
        paths:
          - /var/log/messages*
          - /var/log/syslog*
          - /var/log/system*
        exclude_files:
          - \.gz$
        multiline:
          pattern: ^\s
          match: after
        processors:
          - add_locale: null
        allow_deprecated_use: true
        tags: null
        ignore_older: 72h
  - id: journald-system-54877b53-08c6-45f8-8802-3599e0e5d7bf
    name: system-3
    revision: 1
    type: journald
    use_output: default
    meta:
      package:
        name: system
        version: 2.21.0
        policy_template: system
        release: ga
    data_stream:
      namespace: default
    package_policy_id: 54877b53-08c6-45f8-8802-3599e0e5d7bf
    streams:
      - id: journald-system.auth-54877b53-08c6-45f8-8802-3599e0e5d7bf
        type: journald
        data_stream:
          dataset: system.auth
          type: logs
        facilities:
          - 4
          - 10
        condition: (${host.platform} != "windows") and (${host.os_version} == "12
          (bookworm)" or ${host.os_version} == "13 (trixie)" or
          (${host.os_platform} == "amzn" and ${host.os_version} == "2023") or
          (${host.os_platform} == "sles" and (${host.os_version} == "15 SP1" or
          ${host.os_version} == "15-SP1" or ${host.os_version} == "15 SP2" or
          ${host.os_version} == "15-SP2" or ${host.os_version} == "15 SP3" or
          ${host.os_version} == "15-SP3" or ${host.os_version} == "15 SP4" or
          ${host.os_version} == "15-SP4" or ${host.os_version} == "15 SP5" or
          ${host.os_version} == "15-SP5" or ${host.os_version} == "15 SP6" or
          ${host.os_version} == "15-SP6" or ${host.os_version} == "15 SP7" or
          ${host.os_version} == "15-SP7" or ${host.os_version} == "16.0")))
        tags: null
      - id: journald-system.syslog-54877b53-08c6-45f8-8802-3599e0e5d7bf
        type: journald
        data_stream:
          dataset: system.syslog
          type: logs
        facilities:
          - 0
          - 1
          - 2
          - 3
          - 5
          - 6
          - 7
          - 8
          - 9
          - 11
          - 12
          - 15
        condition: (${host.platform} != "windows") and (${host.os_version} == "12
          (bookworm)" or ${host.os_version} == "13 (trixie)" or
          (${host.os_platform} == "amzn" and ${host.os_version} == "2023") or
          (${host.os_platform} == "sles" and (${host.os_version} == "15 SP1" or
          ${host.os_version} == "15-SP1" or ${host.os_version} == "15 SP2" or
          ${host.os_version} == "15-SP2" or ${host.os_version} == "15 SP3" or
          ${host.os_version} == "15-SP3" or ${host.os_version} == "15 SP4" or
          ${host.os_version} == "15-SP4" or ${host.os_version} == "15 SP5" or
          ${host.os_version} == "15-SP5" or ${host.os_version} == "15 SP6" or
          ${host.os_version} == "15-SP6" or ${host.os_version} == "15 SP7" or
          ${host.os_version} == "15-SP7" or ${host.os_version} == "16.0")))
        tags: null
  - id: winlog-system-54877b53-08c6-45f8-8802-3599e0e5d7bf
    name: system-3
    revision: 1
    type: winlog
    use_output: default
    meta:
      package:
        name: system
        version: 2.21.0
        policy_template: system
        release: ga
    data_stream:
      namespace: default
    package_policy_id: 54877b53-08c6-45f8-8802-3599e0e5d7bf
    streams:
      - id: winlog-system.application-54877b53-08c6-45f8-8802-3599e0e5d7bf
        name: Application
        data_stream:
          dataset: system.application
          type: logs
        condition: ${host.platform} == 'windows'
        ignore_older: 72h
      - id: winlog-system.security-54877b53-08c6-45f8-8802-3599e0e5d7bf
        name: Security
        data_stream:
          dataset: system.security
          type: logs
        condition: ${host.platform} == 'windows'
        ignore_older: 72h
        tags: null
        include_xml: true
        processors:
          - decode_xml:
              when:
                and:
                  - has_fields:
                      - winlog.event_data.TaskContent
                  - equals:
                      winlog.provider_name: Microsoft-Windows-Security-Auditing
              field: winlog.event_data.TaskContent
              target_field: winlog._tmp.scheduled_task.task_content
              to_lower: true
              ignore_missing: true
              ignore_failure: true
          - decode_xml:
              when:
                and:
                  - has_fields:
                      - winlog.event_data.TaskContentNew
                  - equals:
                      winlog.provider_name: Microsoft-Windows-Security-Auditing
              field: winlog.event_data.TaskContentNew
              target_field: winlog._tmp.scheduled_task.task_content_new
              to_lower: true
              ignore_missing: true
              ignore_failure: true
      - id: winlog-system.system-54877b53-08c6-45f8-8802-3599e0e5d7bf
        name: System
        data_stream:
          dataset: system.system
          type: logs
        condition: ${host.platform} == 'windows'
        ignore_older: 72h
  - id: system/metrics-system-54877b53-08c6-45f8-8802-3599e0e5d7bf
    name: system-3
    revision: 1
    type: system/metrics
    use_output: default
    meta:
      package:
        name: system
        version: 2.21.0
        policy_template: system
        release: ga
    data_stream:
      namespace: default
    package_policy_id: 54877b53-08c6-45f8-8802-3599e0e5d7bf
    streams:
      - id: system/metrics-system.cpu-54877b53-08c6-45f8-8802-3599e0e5d7bf
        data_stream:
          dataset: system.cpu
          type: metrics
        metricsets:
          - cpu
        cpu.metrics:
          - percentages
          - normalized_percentages
        period: 10s
      - id: system/metrics-system.diskio-54877b53-08c6-45f8-8802-3599e0e5d7bf
        data_stream:
          dataset: system.diskio
          type: metrics
        metricsets:
          - diskio
        diskio.include_devices: null
        period: 10s
      - id: system/metrics-system.filesystem-54877b53-08c6-45f8-8802-3599e0e5d7bf
        data_stream:
          dataset: system.filesystem
          type: metrics
        metricsets:
          - filesystem
        period: 1m
        processors:
          - drop_event.when.regexp:
              system.filesystem.mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)
      - id: system/metrics-system.fsstat-54877b53-08c6-45f8-8802-3599e0e5d7bf
        data_stream:
          dataset: system.fsstat
          type: metrics
        metricsets:
          - fsstat
        period: 1m
        processors:
          - drop_event.when.regexp:
              system.fsstat.mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)
      - id: system/metrics-system.load-54877b53-08c6-45f8-8802-3599e0e5d7bf
        data_stream:
          dataset: system.load
          type: metrics
        metricsets:
          - load
        condition: ${host.platform} != 'windows'
        period: 10s
      - id: system/metrics-system.memory-54877b53-08c6-45f8-8802-3599e0e5d7bf
        data_stream:
          dataset: system.memory
          type: metrics
        metricsets:
          - memory
        period: 10s
      - id: system/metrics-system.network-54877b53-08c6-45f8-8802-3599e0e5d7bf
        data_stream:
          dataset: system.network
          type: metrics
        metricsets:
          - network
        period: 10s
        interfaces: null
        network.interfaces: null
      - id: system/metrics-system.process-54877b53-08c6-45f8-8802-3599e0e5d7bf
        data_stream:
          dataset: system.process
          type: metrics
        metricsets:
          - process
        period: 10s
        process.include_top_n.by_cpu: 5
        process.include_top_n.by_memory: 5
        process.cmdline.cache.enabled: true
        process.cgroups.enabled: false
        process.include_cpu_ticks: false
        processes:
          - .*
      - id: system/metrics-system.process.summary-54877b53-08c6-45f8-8802-3599e0e5d7bf
        data_stream:
          dataset: system.process.summary
          type: metrics
        metricsets:
          - process_summary
        period: 10s
      - id: system/metrics-system.socket_summary-54877b53-08c6-45f8-8802-3599e0e5d7bf
        data_stream:
          dataset: system.socket_summary
          type: metrics
        metricsets:
          - socket_summary
        period: 10s
      - id: system/metrics-system.uptime-54877b53-08c6-45f8-8802-3599e0e5d7bf
        data_stream:
          dataset: system.uptime
          type: metrics
        metricsets:
          - uptime
        period: 10s
