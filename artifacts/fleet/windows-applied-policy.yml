inputs:
  - id: logfile-system-86b2843c-a0f1-4210-bd23-509d9e2a229c
    name: system-4
    revision: 1
    type: logfile
    use_output: default
    meta:
      package:
        name: system
        version: 2.21.0
        policy_template: system
        release: ga
    data_stream:
      namespace: default
    package_policy_id: 86b2843c-a0f1-4210-bd23-509d9e2a229c
    streams:
      - id: logfile-system.auth-86b2843c-a0f1-4210-bd23-509d9e2a229c
        data_stream:
          dataset: system.auth
          type: logs
        condition: (${host.platform} != "windows") and (${host.os_version} != "12
          (bookworm)" and ${host.os_version} != "13 (trixie)" and
          (${host.os_platform} != "amzn" or ${host.os_version} != "2023") and
          (${host.os_platform} != "sles" or (${host.os_version} != "15 SP1" and
          ${host.os_version} != "15-SP1" and ${host.os_version} != "15 SP2" and
          ${host.os_version} != "15-SP2" and ${host.os_version} != "15 SP3" and
          ${host.os_version} != "15-SP3" and ${host.os_version} != "15 SP4" and
          ${host.os_version} != "15-SP4" and ${host.os_version} != "15 SP5" and
          ${host.os_version} != "15-SP5" and ${host.os_version} != "15 SP6" and
          ${host.os_version} != "15-SP6" and ${host.os_version} != "15 SP7" and
          ${host.os_version} != "15-SP7" and ${host.os_version} != "16.0")))
        ignore_older: 72h
        paths:
          - /var/log/auth.log*
          - /var/log/secure*
        exclude_files:
          - \.gz$
        multiline:
          pattern: ^\s
          match: after
        tags:
          - system-auth
        allow_deprecated_use: true
        processors:
          - add_locale: null
          - rename:
              fields:
                - from: message
                  to: event.original
              ignore_missing: true
              fail_on_error: false
          - syslog:
              field: event.original
              ignore_missing: true
              ignore_failure: true
      - id: logfile-system.syslog-86b2843c-a0f1-4210-bd23-509d9e2a229c
        data_stream:
          dataset: system.syslog
          type: logs
        condition: (${host.platform} != "windows") and (${host.os_version} != "12
          (bookworm)" and ${host.os_version} != "13 (trixie)" and
          (${host.os_platform} != "amzn" or ${host.os_version} != "2023") and
          (${host.os_platform} != "sles" or (${host.os_version} != "15 SP1" and
          ${host.os_version} != "15-SP1" and ${host.os_version} != "15 SP2" and
          ${host.os_version} != "15-SP2" and ${host.os_version} != "15 SP3" and
          ${host.os_version} != "15-SP3" and ${host.os_version} != "15 SP4" and
          ${host.os_version} != "15-SP4" and ${host.os_version} != "15 SP5" and
          ${host.os_version} != "15-SP5" and ${host.os_version} != "15 SP6" and
          ${host.os_version} != "15-SP6" and ${host.os_version} != "15 SP7" and
          ${host.os_version} != "15-SP7" and ${host.os_version} != "16.0")))
        paths:
          - /var/log/messages*
          - /var/log/syslog*
          - /var/log/system*
        exclude_files:
          - \.gz$
        multiline:
          pattern: ^\s
          match: after
        processors:
          - add_locale: null
        allow_deprecated_use: true
        tags: null
        ignore_older: 72h
  - id: journald-system-86b2843c-a0f1-4210-bd23-509d9e2a229c
