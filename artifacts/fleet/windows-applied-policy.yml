  - id: winlog-system-86b2843c-a0f1-4210-bd23-509d9e2a229c
    name: system-4
    revision: 1
    type: winlog
    use_output: default
    meta:
      package:
        name: system
        version: 2.21.0
        policy_template: system
        release: ga
    data_stream:
      namespace: default
    package_policy_id: 86b2843c-a0f1-4210-bd23-509d9e2a229c
    streams:
      - id: winlog-system.application-86b2843c-a0f1-4210-bd23-509d9e2a229c
        name: Application
        data_stream:
          dataset: system.application
          type: logs
        condition: ${host.platform} == 'windows'
        ignore_older: 72h
      - id: winlog-system.security-86b2843c-a0f1-4210-bd23-509d9e2a229c
        name: Security
        data_stream:
          dataset: system.security
          type: logs
        condition: ${host.platform} == 'windows'
        ignore_older: 72h
        tags: null
        include_xml: true
        processors:
          - decode_xml:
              when:
                and:
                  - has_fields:
                      - winlog.event_data.TaskContent
                  - equals:
                      winlog.provider_name: Microsoft-Windows-Security-Auditing
              field: winlog.event_data.TaskContent
              target_field: winlog._tmp.scheduled_task.task_content
              to_lower: true
              ignore_missing: true
              ignore_failure: true
          - decode_xml:
              when:
                and:
                  - has_fields:
                      - winlog.event_data.TaskContentNew
                  - equals:
                      winlog.provider_name: Microsoft-Windows-Security-Auditing
              field: winlog.event_data.TaskContentNew
              target_field: winlog._tmp.scheduled_task.task_content_new
              to_lower: true
              ignore_missing: true
              ignore_failure: true
      - id: winlog-system.system-86b2843c-a0f1-4210-bd23-509d9e2a229c
        name: System
        data_stream:
          dataset: system.system
          type: logs
        condition: ${host.platform} == 'windows'
        ignore_older: 72h
  - id: system/metrics-system-86b2843c-a0f1-4210-bd23-509d9e2a229c
    name: system-4
    revision: 1
    type: system/metrics
    use_output: default
    meta:
      package:
        name: system
        version: 2.21.0
        policy_template: system
        release: ga
    data_stream:
      namespace: default
    package_policy_id: 86b2843c-a0f1-4210-bd23-509d9e2a229c
    streams:
      - id: system/metrics-system.cpu-86b2843c-a0f1-4210-bd23-509d9e2a229c
        data_stream:
          dataset: system.cpu
          type: metrics
        metricsets:
          - cpu
        cpu.metrics:
          - percentages
          - normalized_percentages
        period: 10s
      - id: system/metrics-system.diskio-86b2843c-a0f1-4210-bd23-509d9e2a229c
        data_stream:
          dataset: system.diskio
          type: metrics
        metricsets:
          - diskio
        diskio.include_devices: null
        period: 10s
      - id: system/metrics-system.filesystem-86b2843c-a0f1-4210-bd23-509d9e2a229c
        data_stream:
          dataset: system.filesystem
          type: metrics
        metricsets:
          - filesystem
        period: 1m
        processors:
          - drop_event.when.regexp:
              system.filesystem.mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)
      - id: system/metrics-system.fsstat-86b2843c-a0f1-4210-bd23-509d9e2a229c
        data_stream:
          dataset: system.fsstat
          type: metrics
        metricsets:
          - fsstat
        period: 1m
        processors:
          - drop_event.when.regexp:
              system.fsstat.mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)
      - id: system/metrics-system.load-86b2843c-a0f1-4210-bd23-509d9e2a229c
        data_stream:
          dataset: system.load
          type: metrics
        metricsets:
          - load
        condition: ${host.platform} != 'windows'
        period: 10s
      - id: system/metrics-system.memory-86b2843c-a0f1-4210-bd23-509d9e2a229c
        data_stream:
          dataset: system.memory
          type: metrics
        metricsets:
          - memory
        period: 10s
      - id: system/metrics-system.network-86b2843c-a0f1-4210-bd23-509d9e2a229c
        data_stream:
          dataset: system.network
          type: metrics
        metricsets:
          - network
        period: 10s
        interfaces: null
        network.interfaces: null
      - id: system/metrics-system.process-86b2843c-a0f1-4210-bd23-509d9e2a229c
        data_stream:
          dataset: system.process
          type: metrics
        metricsets:
          - process
        period: 10s
        process.include_top_n.by_cpu: 5
        process.include_top_n.by_memory: 5
        process.cmdline.cache.enabled: true
        process.cgroups.enabled: false
        process.include_cpu_ticks: false
        processes:
          - .*
      - id: system/metrics-system.process.summary-86b2843c-a0f1-4210-bd23-509d9e2a229c
        data_stream:
          dataset: system.process.summary
          type: metrics
        metricsets:
          - process_summary
        period: 10s
      - id: system/metrics-system.socket_summary-86b2843c-a0f1-4210-bd23-509d9e2a229c
        data_stream:
          dataset: system.socket_summary
          type: metrics
        metricsets:
