  <path d="M1480 645V685" stroke="#64748b" stroke-width="5" stroke-dasharray="11 8" marker-end="url(#grayEnd)"/><text x="1480" y="670" text-anchor="middle" class="label" fill="#475569">INTENDED CALLBACK</text>

  <rect x="410" y="900" width="980" height="32" rx="16" fill="#f1f5f9" stroke="#94a3b8"/><text x="900" y="921" text-anchor="middle" class="meta">No direct ubuntu-vnet ↔ win-vnet peering is evidenced; VNet peering is non-transitive.</text>

  <!-- Outcomes -->
  <text x="70" y="990" class="section">3 · Evidence-backed SOC outcomes</text>
  <g>
    <rect x="70" y="1015" width="385" height="112" rx="16" fill="#fff" stroke="#d97706" stroke-width="2"/><text x="95" y="1046" class="outTitle">CONTROLLED ACTIVITY</text><text x="95" y="1072" class="outBody">SSH: myVm → Ubuntu · RDP: Kali → Windows</text><text x="95" y="1096" class="outBody">RDP credential success: not confirmed</text>
    <rect x="495" y="1015" width="385" height="112" rx="16" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="520" y="1046" class="outTitle">DETECTION VALIDATION</text><text x="520" y="1072" class="outBody">SSH threshold 5 · source + user grouping</text><text x="520" y="1096" class="outBody">Windows 4625 threshold 2 · tuning required</text>
    <rect x="920" y="1015" width="385" height="112" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="945" y="1046" class="outTitle">ANALYST INVESTIGATION</text><text x="945" y="1072" class="outBody">Alert details · raw events · user/source pivots</text><text x="945" y="1096" class="outBody">Evidence-based outcome and limitations</text>
    <rect x="1345" y="1015" width="385" height="112" rx="16" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="1370" y="1046" class="outTitle">INCIDENT AUTOMATION</text><text x="1370" y="1072" class="outBody">Elastic webhook → osTicket API</text><text x="1370" y="1096" class="outBody">SSH and RDP-labelled tickets confirmed</text>
    <path d="M455 1071H495" stroke="#64748b" stroke-width="4" marker-end="url(#grayEnd)"/><path d="M880 1071H920" stroke="#64748b" stroke-width="4" marker-end="url(#grayEnd)"/><path d="M1305 1071H1345" stroke="#64748b" stroke-width="4" marker-end="url(#grayEnd)"/>
  </g>

