  <rect x="1230" y="385" width="500" height="500" rx="20" fill="#fff" stroke="#7c3aed" stroke-width="3"/>
  <rect x="1230" y="385" width="500" height="62" rx="18" fill="#ede9fe"/><path d="M1230 427H1730" stroke="#7c3aed" stroke-width="3"/>
  <text x="1255" y="414" class="vnet">win-vnet · spoke</text><text x="1255" y="438" class="meta">10.2.0.0/16 · subnet 10.2.0.0/24 · Japan East</text>

  <!-- Peering, only two verified links -->
  <path d="M570 407H650" stroke="#7c3aed" stroke-width="5" marker-start="url(#purpleStart)" marker-end="url(#purpleEnd)"/><text x="610" y="377" text-anchor="middle" class="label" fill="#6d28d9">VERIFIED PEERING</text>
  <path d="M1150 407H1230" stroke="#7c3aed" stroke-width="5" marker-start="url(#purpleStart)" marker-end="url(#purpleEnd)"/><text x="1190" y="377" text-anchor="middle" class="label" fill="#6d28d9">VERIFIED PEERING</text>

