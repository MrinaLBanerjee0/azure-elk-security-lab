    <rect x="1255" y="475" width="450" height="170" rx="15" fill="#faf8ff" stroke="#7c3aed" stroke-width="2"/><path d="M1255 490Q1255 475 1270 475H1690Q1705 475 1705 490V522H1255Z" fill="#6d28d9"/>
    <text x="1280" y="507" class="cardTitle">Windows endpoint · win</text><text x="1680" y="507" text-anchor="end" class="ip">10.2.0.4</text>
    <text x="1280" y="550" class="strong">Elastic Agent telemetry</text><text x="1280" y="576" class="body">Security · Sysmon · Defender events</text><text x="1280" y="602" class="body">Controlled RDP test target</text>
    <rect x="1280" y="615" width="150" height="22" rx="11" fill="#dcfce7"/><text x="1355" y="630" text-anchor="middle" class="pill" fill="#166534">CONFIRMED</text>

    <rect x="1255" y="685" width="450" height="165" rx="15" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><path d="M1255 700Q1255 685 1270 685H1690Q1705 685 1705 700V732H1255Z" fill="#475569"/>
    <text x="1280" y="717" class="cardTitle">Mythic C2 test server</text><text x="1680" y="717" text-anchor="end" class="ip">10.2.0.5</text>
    <text x="1280" y="762" class="body">HTTP C2 profile configured</text><text x="1280" y="787" class="body">Apollo Windows payload generated</text><rect x="1280" y="803" width="300" height="26" rx="13" fill="#fee2e2"/><text x="1430" y="821" text-anchor="middle" class="pill" fill="#b91c1c">CALLBACK NOT CONFIRMED</text>
  </g>

