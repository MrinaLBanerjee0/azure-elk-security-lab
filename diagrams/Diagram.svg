  <rect x="70" y="385" width="500" height="62" rx="18" fill="#e0f2fe"/><path d="M70 427H570" stroke="#0284c7" stroke-width="3"/>
  <text x="95" y="414" class="vnet">ubuntu-vnet · spoke</text><text x="95" y="438" class="meta">10.1.0.0/16 · subnet 10.1.0.0/24 · Japan West</text>
  <rect x="650" y="385" width="500" height="500" rx="20" fill="#fff" stroke="#16a34a" stroke-width="3"/>
  <rect x="650" y="385" width="500" height="62" rx="18" fill="#dcfce7"/><path d="M650 427H1150" stroke="#16a34a" stroke-width="3"/>
