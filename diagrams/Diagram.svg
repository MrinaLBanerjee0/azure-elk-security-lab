  <rect x="35" y="300" width="1730" height="650" rx="26" fill="url(#azureBg)" stroke="#0078d4" stroke-width="3"/>
  <rect x="62" y="317" width="220" height="38" rx="11" fill="#0078d4"/><text x="172" y="343" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="19" font-weight="800" fill="#fff">MICROSOFT AZURE</text>
  <text x="310" y="343" class="section">2 · Multi-region hub-and-spoke topology</text>

