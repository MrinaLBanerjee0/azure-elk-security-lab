<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">Azure ELK SOC Lab — Verified Architecture and Workflow</title>
  <desc id="desc">Evidence-backed diagram of three Azure virtual networks and six systems, showing two verified peerings, direct endpoint telemetry to Elasticsearch, Fleet management, controlled SSH and RDP testing, alert-to-ticket automation, and an unconfirmed endpoint-initiated Mythic callback.</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <linearGradient id="azureBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#edf6ff"/>
    </linearGradient>
    <marker id="greenEnd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker>
    <marker id="blueEnd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="blueStart" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M10 0L0 5L10 10Z" fill="#2563eb"/></marker>
    <marker id="purpleEnd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <marker id="purpleStart" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M10 0L0 5L10 10Z" fill="#7c3aed"/></marker>
    <marker id="orangeEnd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#d97706"/></marker>
    <marker id="redEnd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
    <marker id="grayEnd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .h1{font:800 40px Inter,"Segoe UI",Arial,sans-serif;fill:#102a43;letter-spacing:.6px}.sub{font:500 19px Inter,"Segoe UI",Arial,sans-serif;fill:#52667a}.eyebrow{font:800 13px Inter,"Segoe UI",Arial,sans-serif;fill:#486581;letter-spacing:1.5px}.section{font:800 22px Inter,"Segoe UI",Arial,sans-serif;fill:#102a43}.vnet{font:800 20px Inter,"Segoe UI",Arial,sans-serif;fill:#102a43}.meta{font:500 13px Inter,"Segoe UI",Arial,sans-serif;fill:#64748b}.cardTitle{font:750 18px Inter,"Segoe UI",Arial,sans-serif;fill:#fff}.ip{font:700 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e0ecff}.body{font:500 14px Inter,"Segoe UI",Arial,sans-serif;fill:#243b53}.strong{font:700 14px Inter,"Segoe UI",Arial,sans-serif;fill:#102a43}.label{font:700 12px Inter,"Segoe UI",Arial,sans-serif;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.outTitle{font:800 16px Inter,"Segoe UI",Arial,sans-serif;fill:#102a43}.outBody{font:500 13px Inter,"Segoe UI",Arial,sans-serif;fill:#52667a}.legend{font:600 12px Inter,"Segoe UI",Arial,sans-serif;fill:#334e68}.pill{font:700 12px Inter,"Segoe UI",Arial,sans-serif}.step{font:700 14px Inter,"Segoe UI",Arial,sans-serif;fill:#243b53}.stepSub{font:500 12px Inter,"Segoe UI",Arial,sans-serif;fill:#64748b}
    </style>
