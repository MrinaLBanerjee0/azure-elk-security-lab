    <rect x="675" y="475" width="450" height="170" rx="15" fill="#f7fef9" stroke="#16a34a" stroke-width="2"/><path d="M675 490Q675 475 690 475H1110Q1125 475 1125 490V522H675Z" fill="#15803d"/>
    <text x="700" y="507" class="cardTitle">Elaskiba · Elasticsearch + Kibana</text><text x="1100" y="507" text-anchor="end" class="ip">10.0.0.4</text>
    <text x="700" y="550" class="body">Store/index endpoint telemetry</text><text x="700" y="576" class="body">Search · rules · alerts · investigation</text><text x="700" y="602" class="body">Dashboards and Fleet UI</text>
    <rect x="700" y="615" width="150" height="22" rx="11" fill="#dcfce7"/><text x="775" y="630" text-anchor="middle" class="pill" fill="#166534">CONFIRMED</text>

    <rect x="675" y="685" width="450" height="165" rx="15" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><path d="M675 700Q675 685 690 685H1110Q1125 685 1125 700V732H675Z" fill="#166534"/>
    <text x="700" y="717" class="cardTitle">Fleet Server</text><text x="1100" y="717" text-anchor="end" class="ip">10.0.0.5</text>
