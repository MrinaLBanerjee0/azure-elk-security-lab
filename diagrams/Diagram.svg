  <rect width="1800" height="1280" fill="url(#page)"/>
  <text x="70" y="48" class="eyebrow">SOC PORTFOLIO · EVIDENCE-BACKED</text>
  <text x="70" y="92" class="h1">Azure ELK Security Lab</text>
  <text x="70" y="126" class="sub">Verified topology, telemetry paths, controlled testing, detection, investigation, and incident automation</text>
  <rect x="1420" y="48" width="310" height="70" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="1575" y="77" text-anchor="middle" class="strong" fill="#166534">Evidence status</text>
  <text x="1575" y="101" text-anchor="middle" class="meta">Confirmed · limited · unconfirmed kept separate</text>

  <!-- Access and testing sources -->
  <text x="70" y="172" class="section">1 · Access and controlled test sources</text>
  <rect x="70" y="192" width="520" height="78" rx="16" fill="#fff" stroke="#475569" stroke-width="2"/>
  <circle cx="112" cy="231" r="23" fill="#102a43"/><text x="112" y="237" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="800" fill="#fff">SOC</text>
  <text x="150" y="224" class="strong">SOC analyst workstation</text><text x="150" y="247" class="body">Browser access to Kibana / Elastic Security</text>
  <rect x="1210" y="192" width="520" height="78" rx="16" fill="#fffaf0" stroke="#d97706" stroke-width="2"/>
  <circle cx="1252" cy="231" r="23" fill="#b45309"/><text x="1252" y="237" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="18" font-weight="800" fill="#fff">K</text>
  <text x="1290" y="224" class="strong">Authorized Kali test host</text><text x="1290" y="247" class="body">RDP reconnaissance and unsuccessful authentication testing</text>

